[paths]
# CLI 运行时输出/中间产物目录
work_dir = "./work-dir"

[transcribe]
# 可选: BIJIAN / JIANYING / WHISPER_API / FASTER_WHISPER / WHISPER_CPP
model = "FASTER_WHISPER"
language = "en"
# 是否生成“字/词级时间戳”中间字幕（用于后续字幕断句）。
# 注意：当前实现中，若 need_word_time_stamp=true，会强制 FasterWhisper 使用 one_word=1（逐词切段）作为中间结果，
# 以便 subtitle 阶段再用 LLM 断句合并；此时在 [transcribe.faster_whisper] 里把 one_word 设为 false 不会生效。
need_word_time_stamp = true
# 长音频分块转录参数（单位：秒）。不填则使用内部默认值。
# 对于 FasterWhisper(cuda) 一般不建议把 chunk_concurrency 调大（会同时起多个进程占用 GPU）。
# chunk_length_sec = 1200
# chunk_overlap_sec = 10
# chunk_concurrency = 1
# SRT / ASS / VTT / TXT / ALL
output_format = "SRT"

[transcribe.faster_whisper]
# 建议 CUDA 服务器使用 xxl GPU 版本（需要 faster-whisper-xxl 在 PATH 或提供 program 路径）
device = "cuda"          # cuda / cpu
model = "large-v3"       # tiny/base/small/medium/large-v1/large-v2/large-v3/large-v3-turbo
model_dir = "./AppData/models"
vad_filter = true
vad_method = "silero_v4" # 例如 silero_v4 / pyannote_v3 ...
vad_threshold = 0.4
ff_mdx_kim2 = false
one_word = true          # 仅当 need_word_time_stamp=false 时才有意义（否则会被强制为 true）
prompt = ""
# 可选：显式指定可执行文件路径或名字（如果不在 PATH 里推荐用绝对路径）
# program = "/usr/local/bin/faster-whisper-xxl"

[subtitle]
need_split = true
need_optimize = true
need_translate = true

# OPENAI / BING / GOOGLE / DEEPLX
translator_service = "OPENAI"

# TargetLanguage 枚举名（见 app/core/translate/types.py）
target_language = "SIMPLIFIED_CHINESE"

# TRANSLATE_ON_TOP / ORIGINAL_ON_TOP / ONLY_ORIGINAL / ONLY_TRANSLATE
subtitle_layout = "TRANSLATE_ON_TOP"

thread_num = 8
batch_size = 5
max_word_count_cjk = 25
max_word_count_english = 20
custom_prompt_text = ""

# 字幕样式（ASS 用），二选一：
subtitle_style_name = "default"
# subtitle_style_file = "/path/to/style.txt"

[llm]
# LLM 用于：字幕断句（word timestamp -> sentence）、字幕优化、LLM 翻译
base_url = "https://api.openai.com/v1"
api_key = "sk-..."
model = "gpt-4o-mini"
reflect = true

[synthesis]
need_video = true
soft_subtitle = false
# ULTRA_HIGH / HIGH / MEDIUM / LOW
video_quality = "MEDIUM"

# 可选：在同一个 config 里写多个 profile，然后用 --profile 选择
#[profiles.gpu_zh]
#[profiles.gpu_zh.transcribe]
#language = "zh"
#[profiles.gpu_zh.subtitle]
#target_language = "SIMPLIFIED_CHINESE"
